<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mama Tech - Transform Health Proposal (Full Package)</title>
<style>
  :root {
    --ink: #1a2332;
    --muted: #5b6b82;
    --brand: #0c6b58;
    --brand-dark: #08493d;
    --accent: #e8f3f0;
    --line: #dde4ec;
    --bg: #ffffff;
    --paper: #f7f9fb;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.6;
  }
  a { color: var(--brand); }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--ink);
    color: #fff;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 14px;
  }
  .toolbar .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    display: inline-block;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .btn:hover { background: var(--brand-dark); text-decoration: none; }
  .btn.ghost { background: rgba(255,255,255,.12); }
  #status { font-size: 13px; color: #cfd9e6; }
  .package {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px;
    background: var(--bg);
    min-height: calc(100vh - 60px);
  }
  .cover { text-align: center; padding: 60px 24px 40px; }
  .cover .brand { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 18px; }
  .cover h1 { font-size: 30px; line-height: 1.3; margin: 0 0 10px; }
  .cover .sub { font-size: 16px; color: var(--muted); margin-bottom: 6px; }
  .cover .meta { font-size: 13.5px; color: var(--muted); }
  .cover .parts { margin: 22px auto 0; max-width: 520px; text-align: left; font-size: 14px; border-top: 1px solid var(--line); padding-top: 16px; }
  .cover .parts li { margin-bottom: 6px; }
  /* --- Shared content styles (mirror of the site pages) --- */
  h1 { font-size: 26px; line-height: 1.3; margin: 0 0 8px; }
  h2 { font-size: 21px; margin: 34px 0 10px; padding-bottom: 4px; border-bottom: 2px solid var(--accent); }
  h3 { font-size: 16.5px; margin: 22px 0 6px; color: var(--brand-dark); }
  h4 { font-size: 15px; margin: 16px 0 6px; }
  p { margin: 0 0 12px; }
  ul, ol { margin: 0 0 14px; padding-left: 22px; }
  li { margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 10px; border: 1px solid var(--line); vertical-align: top; }
  th { background: var(--accent); font-weight: 600; }
  .num { text-align: right; white-space: nowrap; }
  .total-row { background: var(--accent); font-weight: 700; }
  .lede { color: var(--muted); }
  .meta { color: var(--muted); font-size: 13.5px; }
  .sub-text { color: var(--muted); font-size: 14px; margin-bottom: 4px; }
  .doc-meta { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .subject { border-left: 4px solid var(--brand); padding: 8px 16px; background: var(--paper); font-size: 15px; margin: 14px 0 18px; font-weight: 600; }
  .sig p { margin: 0 0 2px; }
  .sig .links { margin-top: 8px; }
  .card, .sample {
    border: 1px solid var(--line);
    border-left: 4px solid var(--brand);
    border-radius: 8px;
    padding: 14px 18px;
    margin: 12px 0;
    background: var(--paper);
  }
  .sample h2 { border-bottom: none; margin-top: 0; }
  .sample-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 12px; }
  .sample-grid .sample { margin: 0; }
  .sample-thumb { display: none; }
  .quote {
    border-left: 4px solid var(--brand);
    margin: 12px 0;
    padding: 10px 18px;
    background: var(--accent);
    border-radius: 0 8px 8px 0;
    font-style: italic;
  }
  .note {
    border: 1px solid #eadfaa;
    background: #fdf8e7;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    margin: 12px 0;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .grid .card { margin: 0; }
  .embed-example { margin-top: 18px; }
  .embed-example h2 { font-size: 19px; border-bottom: none; }
  .embed-url { margin: 10px 0 12px; padding: 10px 14px; background: var(--accent); border: 1px solid var(--line); border-radius: 8px; display: inline-block; max-width: 100%; }
  .embed-url a { font-weight: 600; word-break: break-all; }
  .fee-hero { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; margin: 14px 0; padding: 16px 20px; background: var(--accent); border-radius: 10px; border: 1px solid var(--line); }
  .fee-hero .label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .fee-hero .amount { font-size: 34px; font-weight: 800; color: var(--brand-dark); }
  .svg-fig { margin: 14px 0 8px; }
  .svg-fig svg { width: 100%; height: auto; display: block; max-width: 820px; }
  .figcap { font-size: 12.5px; color: var(--muted); font-style: italic; margin: 8px 0 12px; }
  .toc { font-size: 15px; }
  .docpage { page-break-before: always; }
  .docpage:first-of-type { page-break-before: auto; }
  @media (max-width: 720px) {
    .sample-grid, .grid { grid-template-columns: 1fr; }
  }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .package { max-width: none; padding: 0; }
    .cover { padding: 10px 0 30px; page-break-after: always; }
    a { color: var(--ink); }
  }
</style>
</head>
<body>

<div class="toolbar">
  <span class="btns">
    <button type="button" class="btn" onclick="window.print()">Save / Print as PDF</button>
    <a class="btn ghost" href="index.html">Back to site</a>
  </span>
  <span id="status">Preparing combined PDF…</span>
</div>

<div class="package" id="package">
  <p id="statusMsg" style="color:var(--muted)"></p>
</div>

<script>
  var ORDER = [
    ["index.html", "Overview"],
    ["cover-letter.html", "Cover Letter"],
    ["proposal.html", "Brief Proposal and Technical Approach"],
    ["work-samples.html", "Relevant Work Samples"],
    ["quote.html", "Proposed Quote and Breakdown"]
  ];

  function pickMain(doc, name) {
    if (name === "proposal.html") return doc.querySelector("article.content");
    return doc.querySelector("main");
  }

  function clean(frag, name) {
    frag.querySelectorAll(".sample-thumb, .toc-toggle, aside, button").forEach(function (el) {
      el.setAttribute("data-q", "1");
    });
    frag.querySelectorAll("[data-q='1']").forEach(function (el) { el.remove(); });
    return frag.innerHTML;
  }

  function buildCover() {
    return '<section class="cover">' +
      '<div class="brand">Mama Tech &middot; Transform Health Proposal</div>' +
      '<h1>Agentic Feature for the Health Data Governance Legislative and Regulatory Assessment Tool</h1>' +
      '<div class="sub">Consultancy application package &mdash; Naijeria Toweett / Mama Tech</div>' +
      '<div class="meta">Proposed fee USD 13,555 &middot; Delivery October 2026 &ndash; February 2027</div>' +
      '<ol class="parts">' +
      ORDER.map(function (o, i) { return "<li>" + (i + 1) + ". " + o[1] + "</li>"; }).join("") +
      "</ol>" +
      '</section>';
  }

  var package = document.getElementById("package");
  var status = document.getElementById("status");
  var statusMsg = document.getElementById("statusMsg");

  if (location.protocol === "file:") {
    status.textContent = "Open this page on GitHub Pages";
    statusMsg.textContent = "The PDF download uses the live site. Open https://mamatechafrica.github.io/transform_health_agentic_ai_proposal/print-all.html in a browser, then use Save / Print as PDF.";
  } else {
    Promise.all(ORDER.map(function (o) {
      return fetch(o[0]).then(function (r) { return r.text(); }).then(function (html) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        var node = pickMain(doc, o[0]);
        return o[0] + "|" + node.innerHTML;
      });
    })).then(function (parts) {
      var out = buildCover();
      parts.forEach(function (raw, i) {
        var sep = raw.indexOf("|");
        var tmp = document.createElement("div");
        tmp.innerHTML = raw.slice(sep + 1);
        out += '<section class="docpage">' +
          '<div class="sub-text">Mama Tech &middot; Transform Health Proposal &mdash; Part ' + (i + 1) + " of " + parts.length + ": " + ORDER[i][1] + "</div>" +
          clean(tmp, raw.slice(0, sep)) + "</section>";
      });
      package.innerHTML = out;
      status.textContent = "Ready &mdash; choose \u201CSave as PDF\u201D as the destination.";
      setTimeout(function () { window.print(); }, 450);
    }).catch(function (err) {
      status.textContent = "Could not load pages";
      statusMsg.textContent = "Failed to load one of the pages: " + err.message;
    });
  }
</script>

</body>
</html>
